repo:
  name: ohjaa
  role: internal tool — steering knowledge for agents; holds what the people they work for know and have decided, and briefs every agent with it before it acts
  not:
    - message bus
    - scheduler
    - agent-to-agent handoff
    - database
    - daemon

context:
  default_budget: 4000
  important_docs:
    - README.md
    - AGENTS.md
  read_first: []
  safe_to_ignore:
    - target/
    - vendor/

validation:
  replace_inferred: true
  fast:
    - cargo test
  strict:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
  full:
    - cargo test
  privileged: []

boundaries:
  - One Rust crate producing a single `ohjaa` binary. Dependencies stay minimal — anyhow, clap, serde, serde_json, and the vendored faija-knowledge (knowledge-node.v1) — and every addition needs a reason.
  - Ohjaa holds Knowledge; toimija reports facts. Never reimplement anything toimija derives — shell out to its CLI and consume its --json.
  - Knowledge is the one thing ohjaa stores, as knowledge-node.v1 files in the scope directories, plus proposals waiting for a person. Everything else — fleet, perimeter, coverage — is derived now and stored never. No index, no cache, no database, no daemon.
  - Agents propose; only a person makes Knowledge current, retires it or rejects it. Shared Knowledge (ours, repo) is reviewed in a pull request before any agent reads it. A proposal never lands in a shared repository by itself.
  - Cross-repo yes, messaging no. Permanently refused - request/response between agents, presence, and agent-to-agent handoff. Knowledge is not a message - it carries its time, its why and whose it is.
  - Network only in `ohjaa intake`, and only through the tools it names - `gh` for review comments and the configured drafter. Every other command works from the filesystem and local CLIs.
  - Failed coverage is never rendered as an empty result. If a scan could not look, it says so and exits non-zero.
