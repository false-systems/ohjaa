repo:
  name: ohjaa
  role: internal tool — the deciding layer above toimija; refuses blind launches and derives fleet-wide views
  not:
    - inbox
    - message bus
    - scheduler
    - index
    - database
    - daemon
    - network client

context:
  default_budget: 4000
  important_docs:
    - README.md
    - AGENTS.md
  read_first: []
  safe_to_ignore:
    - target/

validation:
  replace_inferred: true
  fast:
    - cargo test
  strict:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
  full:
    - cargo test
  privileged: []

boundaries:
  - One Rust crate producing a single `ohjaa` binary. Dependencies stay minimal — anyhow, clap, serde, serde_json — and every addition needs a reason.
  - Ohjaa decides; toimija reports. Never reimplement anything toimija or sauma already derives — shell out to their CLIs and consume their --json. Ohjaa never speaks the plugin protocol and never compiles a packet.
  - Derive, never store. No inbox, no index, no cache, no database, no daemon, no persistence. The configured root list holds paths, never contents.
  - Cross-repo yes, messaging no. Permanently refused - an inbox, request/response, and presence. A message that can go stale without confessing it does not belong here.
  - "`ohjaa cycle` is the sole dispatch surface: it derives one action from a declared facts snapshot and may launch that one agent leg through Toimija. It has no durable state, scheduler, or agent-to-agent handoff."
  - Anything crossing a repo boundary travels as a digest anchored to a repository point, verified by sauma, so it self-invalidates when the tree moves. Nothing is trusted because it was sent.
  - No network. Cross-repo is filesystem reads. Cross-machine is a separate, explicit boundary decision — not a side effect of cross-repo.
  - Failed coverage is never rendered as an empty result. If a scan could not look, it says so and exits non-zero.
