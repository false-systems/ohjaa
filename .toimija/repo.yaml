repo:
  name: ohjaa
  role: internal tool — steering knowledge for agents; holds what the people they work for know and have decided, briefs every agent with it before it acts, and keeps a machine-local log of every session it runs
  not:
    - message bus
    - scheduler
    - dispatch
    - daemon

context:
  default_budget: 4000
  important_docs:
    - README.md
    - AGENTS.md
  read_first: []
  safe_to_ignore:
    - target/
    - vendor/

validation:
  replace_inferred: true
  fast:
    - cargo test
  strict:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
  full:
    - cargo test
  privileged: []

boundaries:
  - One Rust crate producing a single `ohjaa` binary. Dependencies stay minimal — anyhow, clap, serde, serde_json, the vendored faija-knowledge (knowledge-node.v1), redb (the session log) and libc (signal dispositions while a session runs, and the kernel's word on processes) — and every addition needs a reason. Tests alone also use sha2 and serde_yaml (the parser toimija reads .toimija/repo.yaml with, so a config toimija cannot parse fails CI here).
  - Ohjaa holds Knowledge; toimija reports facts. Never reimplement anything toimija derives — shell out to its CLI and consume its --json.
  - Ohjaa stores two things. Knowledge, as knowledge-node.v1 files in the scope directories plus proposals waiting for a person, is the truth and lives in git - ours and repo in their repositories, mine and machine in the home's own history. The session log, in redb at $XDG_STATE_HOME/ohjaa/sessions.redb, is machine-local history of what each session was briefed, read back, committed, finished and handed over, plus explicitly attributed usage receipts, the ids of the agent's own sessions found at leaving in its transcripts (read, never written) and those its environment claimed from inside the session while it was open (the agent's testimony, never outranking what was found), and references to the validations `ohjaa gate` and ohjaa itself requested (sykli's run ids and receipts, never outcomes) - deleting it loses no knowledge, it never blocks a launch, and a broken log is reported, never replaced. Beside it, $XDG_STATE_HOME/ohjaa holds one validation folder per clone (`integrated/<clone>/` - the clone's one rolling validation checkout, the cargo target dir that checkout builds in, and copies of its runs' receipts), the lock that lets one ohjaa at a time ask for a clone's validation, and the gates derived from commits that a run outliving its ohjaa names (`derived/<digest>/`). It also holds intake's cursor (`intake-since`), intake's progress (`intake-handled` - a version line; per candidate the drafter answered for or failed on, its time and a digest of its words, never the words, and for a failure how often and why in ohjaa's words, kept until the drafter answers for it; an end line with the count), the lock that lets one intake run at a time (`intake.lock`), and the report's two times (`report-at`, `report-shown-at`). Deleting them loses no knowledge - intake then reads its default window again, and sends once more what is still in it. Everything else — fleet, perimeter, coverage, marks — is derived now and stored never. No knowledge index, no cache, no daemon.
  - 'The workflow lives in the home, outside every repository. `~/.config/ohjaa` holds each repository''s entry (`repos/<owner>/<repo>/` - `repo.toml`, the branch ohjaa observes and the env lines its gate gives cargo tasks, plus its generated hooks folder and `gated.config`; every commit''s gate is derived, from its own `sykli.json` and `sykli.lock`, or from `sykli init` on its tree for a repository with none, plus the entry''s env lines, and ohjaa keeps no stored gate), the generated `git/` config and `roots`. Only repositories whose remote names an entry run ohjaa''s hooks, and only the hooks that entry needs; no other git command anywhere starts ohjaa, and ohjaa works its git facts out once instead of asking git again. The home is also a local git repository, its history - ohjaa makes it with its first commit (or uses the one the home already is), never gives it a remote and never pushes it, and commits there, with the person''s git identity, each decision on mine or machine knowledge and each `apply`, `apply --undo` and `adopt` (`git add -A`, then `git commit`), each under the home''s lock (`.git/ohjaa.lock`) and holding only what ohjaa keeps there (an allowlist in the repository''s own `.git/info/exclude`); a commit that fails is said, and the change stands. Outside the home, `ohjaa apply` changes only one `include.path` in git''s global config, a marked block in git''s global excludes file, one line of `~/.zshrc`, and a marked block of mine and machine knowledge (`ohjaa:knowledge`) in each agent''s own global instruction file that already exists outside every repository (Claude Code''s `~/.claude/CLAUDE.md`, Codex''s `~/.codex/AGENTS.md`, pi''s `~/.pi/agent/AGENTS.md`, opencode''s `~/.config/opencode/AGENTS.md`, each where the agent finds it; none is created, no text around the block is touched, and a block apply did not write is the person''s and stays), records each before making it, and `apply --undo` puts them back; each decision rewrites that block where it is, and nowhere else; `ohjaa adopt` writes only in the home. Nothing is installed on or written into a repository but what git keeps beside it - the clone''s one validation checkout, a linked worktree kept in ohjaa''s state directory (`$XDG_STATE_HOME/ohjaa/integrated/<clone>/checkout`, whose admin folder git keeps in the clone''s `.git/worktrees/`). No file, hook or config of a repository is written, and the dispatcher always runs a repository''s own hooks after observing.'
  - Observe, mark and flag; never refuse for the workflow. A push to an entry's branch is handed to sykli and, when sykli does not prove it, pushed and flagged, never stopped; only a repository's own hooks refuse. Each commit on that branch is marked proven, failed or unproven from the receipts on disk, and a briefing opens with the flag while the branch is not proven at its tip. A landing on it whose tree sykli has no current receipt of is validated as the integrated State (a durable sykli run, recorded before it is asked for), and a candidate validated on a base the branch has moved from since is flagged, never refused.
  - '`ohjaa run` stays the parent of the session until it ends, so leaving always writes its record, whatever the exit. Session states are observed, not declared - the agent’s lifecycle testimony is its read-back (`ohjaa oriented`) and handover (`ohjaa handover`). Imported usage is separately labelled source testimony; it never becomes observed work or authoritative billing.'
  - Agents propose; only a person makes Knowledge current, retires it or rejects it. Shared Knowledge (ours, repo) is reviewed in a pull request before any agent reads it. A proposal never lands in a shared repository by itself.
  - Cross-repo yes, messaging no. Permanently refused - request/response between agents, presence, and dispatch (assigning work to an agent). Knowledge is not a message - it carries its time, its why and whose it is. A session's handover is a record for whoever comes next, shown in the next briefing, never a message to a particular agent.
  - Network only through `gh` and the drafter - in `ohjaa intake` (review comments, drafting) and when a session leaves (its branch's pull request, bounded, recorded as unknown when gh cannot say). Every other command works from the filesystem and local CLIs.
  - Failed coverage is never rendered as an empty result. If a scan could not look, it says so and exits non-zero.
