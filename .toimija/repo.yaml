repo:
  name: ohjaa
  role: internal tool — steering knowledge for agents; holds what the people they work for know and have decided, briefs every agent with it before it acts, and keeps a machine-local log of every session it runs
  not:
    - message bus
    - scheduler
    - dispatch
    - daemon

context:
  default_budget: 4000
  important_docs:
    - README.md
    - AGENTS.md
  read_first: []
  safe_to_ignore:
    - target/
    - vendor/

validation:
  replace_inferred: true
  fast:
    - cargo test
  strict:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings
    - cargo test
  full:
    - cargo test
  privileged: []

boundaries:
  - One Rust crate producing a single `ohjaa` binary. Dependencies stay minimal — anyhow, clap, serde, serde_json, the vendored faija-knowledge (knowledge-node.v1), redb (the session log) and libc (signal dispositions while a session runs) — and every addition needs a reason.
  - Ohjaa holds Knowledge; toimija reports facts. Never reimplement anything toimija derives — shell out to its CLI and consume its --json.
  - Ohjaa stores two things. Knowledge, as knowledge-node.v1 files in the scope directories plus proposals waiting for a person, is the truth and lives in git. The session log, in redb at $XDG_STATE_HOME/ohjaa/sessions.redb, is machine-local history of what each session was briefed, read back, committed, finished and handed over - deleting it loses no knowledge, it never blocks a launch, and a broken log is reported, never replaced. Everything else — fleet, perimeter, coverage — is derived now and stored never. No knowledge index, no cache, no daemon.
  - '`ohjaa run` stays the parent of the session until it ends, so leaving always writes its record, whatever the exit. Session states are observed, not declared - the agent writes only its read-back (`ohjaa oriented`) and its handover (`ohjaa handover`).'
  - Agents propose; only a person makes Knowledge current, retires it or rejects it. Shared Knowledge (ours, repo) is reviewed in a pull request before any agent reads it. A proposal never lands in a shared repository by itself.
  - Cross-repo yes, messaging no. Permanently refused - request/response between agents, presence, and dispatch (assigning work to an agent). Knowledge is not a message - it carries its time, its why and whose it is. A session's handover is a record for whoever comes next, shown in the next briefing, never a message to a particular agent.
  - Network only through `gh` and the drafter - in `ohjaa intake` (review comments, drafting) and when a session leaves (its branch's pull request, bounded, recorded as unknown when gh cannot say). Every other command works from the filesystem and local CLIs.
  - Failed coverage is never rendered as an empty result. If a scan could not look, it says so and exits non-zero.
