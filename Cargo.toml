[package]
name = "ohjaa"
version = "0.2.1"
edition = "2021"
description = "Steering knowledge for agents: the graph of what the people they work for know and have decided."
license = "MIT"

[[bin]]
name = "ohjaa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# knowledge-node.v1, carried rather than fetched: faija is private and publishes
# nothing. Pinned and drift-checked by `vendor/faija-knowledge.contract` and
# `tests/vendored_knowledge.rs`; refresh with the script beside it.
faija-knowledge = { path = "vendor/faija-knowledge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
sha2 = "0.10"
# Tests only: the parser toimija reads `.toimija/repo.yaml` with, so a config
# toimija cannot parse fails CI here instead of every packet refresh.
serde_yaml = "0.9"

# Signal dispositions (unix only): `ohjaa run` must outlive the signals that
# would cut the leaving record short, and forward stop signals to the session.
# And the kernel's word on processes (kill(2): whether a session's ohjaa or
# process group still runs), and flock(2) for the locks.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
