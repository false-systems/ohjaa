[package]
name = "ohjaa"
version = "0.2.1"
edition = "2021"
rust-version = "1.98"
description = "Steering knowledge for agents: the graph of what the people they work for know and have decided."
license = "MIT"
repository = "https://github.com/false-systems/ohjaa"
readme = "README.md"
keywords = ["agents", "knowledge", "instructions", "cli"]
categories = ["command-line-utilities", "development-tools"]
# The package is the source, the README and the licence: no tests, fixtures,
# CI files or agent guides.
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

# One `cargo test` or `cargo clippy` at the root covers both crates.
[workspace]
members = ["crates/knowledge-node"]
default-members = [".", "crates/knowledge-node"]

[[bin]]
name = "ohjaa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The knowledge-node.v1 format: ohjaa defines it, in a crate of its own so
# that another tool can read the format without the rest of ohjaa. The version
# is what the registry resolves: a published ohjaa needs this crate published
# first.
knowledge-node = { version = "0.1.0", path = "crates/knowledge-node" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
[dev-dependencies]
# Tests only: the parser toimija reads `.toimija/repo.yaml` with, so a config
# toimija cannot parse fails CI here instead of every packet refresh.
serde_yaml = "0.9"

# Unix only: flock(2) for the locks, process groups for what ohjaa starts, and
# the local time zone.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
