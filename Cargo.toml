[package]
name = "ohjaa"
version = "0.2.0"
edition = "2021"
description = "Steering knowledge for agents: the graph of what the people they work for know and have decided."
license = "MIT"

[[bin]]
name = "ohjaa"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# knowledge-node.v1, carried rather than fetched: faija is private and publishes
# nothing. Pinned and drift-checked by `vendor/faija-knowledge.contract` and
# `tests/vendored_knowledge.rs`; refresh with the script beside it.
faija-knowledge = { path = "vendor/faija-knowledge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The machine-local session log (what each session was briefed, read back,
# committed and handed over). Same store teko used; knowledge never lives here.
redb = "4.1.0"
# Signal dispositions: `ohjaa run` must outlive Ctrl-C to write the leaving
# record, and forward SIGTERM to the session it launched.
libc = "0.2"

[dev-dependencies]
sha2 = "0.10"
