name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# One run per ref: a superseded push cancels the run it replaced instead of
# both finishing on hosted minutes. Pushes to main are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Kept from the arc-runner days, when anonymous git-over-HTTPS egress was
      # rate-limited and broke toimija's CI (PR #203). Ohjaa has no git
      # dependencies today; it stays so a future one cannot break CI on any
      # runner. Scoped to false-systems only.
      - name: Authenticate git dependency fetches
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/false-systems/".insteadOf "https://github.com/false-systems/"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "::error::runner is missing cc and apt-get; the hosted arm64 image should already carry cc"
            exit 1
          fi
          sudo_cmd=""
          if [ "$(id -u)" -ne 0 ]; then
            if ! command -v sudo >/dev/null 2>&1; then
              echo "::error::runner is missing cc and needs sudo or root to install build-essential"
              exit 1
            fi
            sudo_cmd="sudo"
          fi
          $sudo_cmd apt-get update
          $sudo_cmd apt-get install -y --no-install-recommends build-essential ca-certificates

      - name: Check formatting
        run: cargo fmt --check

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
